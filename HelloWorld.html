<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #00c6ff);
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
      color: white;
    }

    .container {
      text-align: center;
      z-index: 2;
      animation: fadeIn 2s ease;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 7rem);
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #fff;
      text-shadow:
        0 0 10px #00eaff,
        0 0 20px #00eaff,
        0 0 40px #00eaff,
        0 0 80px #00eaff;
      animation: glow 2s ease-in-out infinite alternate;
    }

    p {
      margin: 20px 0 30px;
      font-size: 1.2rem;
      opacity: 0.85;
    }

    button {
      padding: 14px 35px;
      border: 2px solid #00eaff;
      border-radius: 50px;
      background: transparent;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px #00eaff;
    }

    button:hover {
      background: #00eaff;
      color: #111;
      transform: scale(1.1);
      box-shadow:
        0 0 20px #00eaff,
        0 0 50px #00eaff;
    }

    /* Floating particles */
    .particle {
      position: absolute;
      bottom: -20px;
      width: 8px;
      height: 8px;
      background: #00eaff;
      border-radius: 50%;
      box-shadow: 0 0 15px #00eaff;
      animation: float linear infinite;
    }

    .particle:nth-child(1) {
      left: 10%;
      animation-duration: 7s;
    }

    .particle:nth-child(2) {
      left: 25%;
      animation-duration: 10s;
      animation-delay: 2s;
    }

    .particle:nth-child(3) {
      left: 40%;
      animation-duration: 8s;
      animation-delay: 1s;
    }

    .particle:nth-child(4) {
      left: 60%;
      animation-duration: 12s;
      animation-delay: 3s;
    }

    .particle:nth-child(5) {
      left: 75%;
      animation-duration: 9s;
      animation-delay: 2s;
    }

    .particle:nth-child(6) {
      left: 90%;
      animation-duration: 11s;
      animation-delay: 1s;
    }

    @keyframes gradient {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes glow {
      from {
        text-shadow:
          0 0 10px #00eaff,
          0 0 20px #00eaff;
      }

      to {
        text-shadow:
          0 0 20px #00eaff,
          0 0 40px #00eaff,
          0 0 70px #0077ff;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) scale(0.3);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <!-- Floating particles -->
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="container">
    <h1>Hello World</h1>
    <p>Welcome to my animated HTML page ✨</p>

    <button onclick="showMessage()">
      Click Me
    </button>
  </div>

  <script>
    function showMessage() {
      alert("Hello World! 👋");
    }
  </script>

</body>
</html>
