<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CSS Grid — named areas</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    .page > * { padding: 1rem; }

    .page {
      display: grid;
      min-height: 100vh;
      grid-template-columns: 240px 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "header  header"
        "sidebar main"
        "footer  footer";
      gap: 1rem;
    }

    .page > header  { grid-area: header;  background: #c5cae9; }
    .page > nav     { grid-area: sidebar; background: #c8e6c9; }
    .page > main    { grid-area: main;    background: #fff9c4; }
    .page > footer  { grid-area: footer;  background: #ffccbc; }

    @media (max-width: 767px) {
      .page {
        grid-template-columns: 1fr;
        grid-template-areas:
          "header"
          "main"
          "sidebar"
          "footer";
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>Header — spans both columns</header>
    <nav>Sidebar</nav>
    <main>
      <p>Main. On a narrow screen this sits above the sidebar.</p>
      <p>Span recipes (use on a grid <em>item</em>): <code>grid-column: 1 / 3</code>, <code>span 2</code>, or <code>1 / -1</code> for full width.</p>
    </main>
    <footer>Footer — spans both columns</footer>
  </div>
</body>
</html>
