<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>

    <h2>Contact Us</h2>

    <form action="#" method="POST">
        
        <label for="name"><strong>Name:</strong></label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name" required size="40">
        <br><br>

        <label for="email"><strong>Email:</strong></label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required size="40">
        <br><br>

        <label for="message"><strong>Message:</strong></label><br>
        <textarea id="message" name="message" rows="6" cols="40" placeholder="Write your message here..." required></textarea>
        <br><br>

        <button type="submit">Send Message</button>
        <button type="reset">Clear</button>

    </form>

</body>
</html>
